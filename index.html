<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brankas Cyber</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ===== Reset & Base ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #0b0f19; color: #e4e6eb; min-height: 100vh;
    display: flex; justify-content: center;
    background-image: linear-gradient(rgba(18, 22, 34, 0.95), rgba(11, 15, 25, 0.98)), url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80');
    background-size: cover; background-position: center;
  }
  .app { width: 100%; max-width: 900px; padding: 20px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(22, 27, 43, 0.8); backdrop-filter: blur(10px); border: 1px solid #2a3344; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); }
  header b { font-size: 1.2rem; color: #00ffcc; letter-spacing: 0.5px; }
  header small { display: block; color: #8b9bb4; font-size: 0.8rem; margin-top: 2px; }
  h1, h2, h3 { color: #ffffff; }
  .muted { color: #8b9bb4; }
  .tiny { font-size: 0.75rem; color: #6c7a92; margin-top: 15px; }
  .tiny code { background: #1a2033; padding: 2px 6px; border-radius: 4px; color: #ff4d4d; }
  .hidden { display: none !important; }
  
  /* ===== Auth & Cards ===== */
  .auth { max-width: 450px; margin: 40px auto; padding: 30px; text-align: center; }
  .card { background: rgba(22, 27, 43, 0.9); border: 1px solid #2a3344; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
  .auth h1 { margin-bottom: 10px; font-size: 2rem; text-transform: uppercase; letter-spacing: 1px; background: linear-gradient(90deg, #00ffcc, #00a8ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .auth p.muted { margin-bottom: 20px; }
  .tabs { display: flex; background: #1a2033; border-radius: 8px; padding: 5px; margin-bottom: 20px; }
  .tabs button { flex: 1; padding: 10px; background: transparent; border: none; color: #8b9bb4; cursor: pointer; border-radius: 6px; transition: all 0.3s ease; font-weight: bold; }
  .tabs button.active { background: #00ffcc; color: #0b0f19; }

  /* ===== Forms ===== */
  input, select, textarea { width: 100%; padding: 12px 15px; background: #0f1421; border: 1px solid #2a3344; border-radius: 8px; color: #e4e6eb; margin-bottom: 15px; transition: all 0.3s ease; font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #00a8ff; box-shadow: 0 0 0 3px rgba(0, 168, 255, 0.2); }
  label { display: block; font-size: 0.9rem; color: #b0b8c8; margin-bottom: 5px; }
  textarea { resize: vertical; min-height: 80px; }

  /* ===== Buttons ===== */
  button { padding: 12px 20px; background: #00a8ff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: transform 0.2s, box-shadow 0.2s; font-family: inherit; }
  button:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0, 168, 255, 0.3); }
  button.secondary { background: #2a3344; color: #b0b8c8; }
  button.secondary:hover { background: #364056; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); }
  button.danger { background: #ff4d4d; }
  button#logoutBtn:hover { box-shadow: 0 4px 15px rgba(255, 77, 77, 0.3); }
  .passrow { display: flex; gap: 10px; }
  .passrow input { margin-bottom: 0; }
  .passrow button { padding: 12px 15px; background: #1a2033; }

  /* ===== Vault ===== */
  .welcome { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .welcome h2 { font-size: 1.1rem; font-weight: normal; }
  .toolbar { display: flex; gap: 15px; margin-bottom: 20px; }
  .toolbar input, .toolbar select { margin-bottom: 0; }
  .toolbar input { flex: 2; } .toolbar select { flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
  .item-card { background: rgba(22, 27, 43, 0.8); border: 1px solid #2a3344; border-radius: 12px; padding: 15px; transition: all 0.3s ease; position: relative; }
  .item-card:hover { border-color: #00a8ff; transform: translateY(-3px); box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4); }
  .item-card h3 { font-size: 1rem; margin-bottom: 5px; padding-right: 80px; /* Space for actions */ }
  .item-card .cat { display: inline-block; font-size: 0.7rem; padding: 3px 8px; background: #1a2033; color: #00ffcc; border-radius: 4px; margin-bottom: 10px; text-transform: uppercase; }
  .item-card p { font-size: 0.85rem; color: #b0b8c8; word-break: break-all; }
  .item-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; }
  .item-actions button { padding: 5px 10px; background: transparent; border: 1px solid #2a3344; color: #8b9bb4; font-size: 0.8rem; }
  .item-actions button:hover { border-color: #00a8ff; color: #00a8ff; transform: none; box-shadow: none; }
  .item-actions button.del:hover { border-color: #ff4d4d; color: #ff4d4d; }

  /* ===== Modal ===== */
  .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
  .modalBox { background: #161b2b; border: 1px solid #2a3344; border-radius: 16px; width: 100%; max-width: 500px; padding: 25px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
  .modalHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modalHead h3 { color: #00ffcc; }
  #closeModal { background: none; color: #8b9bb4; font-size: 1.5rem; padding: 0; line-height: 1; }
  #closeModal:hover { transform: none; box-shadow: none; color: #ff4d4d; }
  .actions { display: flex; gap: 10px; margin-top: 10px; }
  .actions button { flex: 1; }

  .msg { color: #ff4d4d; font-size: 0.85rem; margin-top: 10px; min-height: 1.2rem; text-align: center; }
  .empty { text-align: center; color: #6c7a92; margin-top: 50px; font-style: italic; }
  
  @media (max-width: 600px) { .welcome { flex-direction: column; align-items: flex-start; gap: 15px; } .toolbar { flex-direction: column; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><b>🛡️ Brankas Cyber</b><small>Brankas digital pribadi</small></div>
    <button id="logoutBtn" class="danger hidden">Keluar</button>
  </header>

  <main>
    <section id="authView" class="card auth">
      <h1>Brankas Cyber</h1>
      <p class="muted">Simpan data penting Anda dengan kontrol akses per akun.</p>
      <div class="tabs">
        <button id="loginTab" class="active">Masuk</button>
        <button id="registerTab">Daftar</button>
      </div>
      <form id="authForm">
        <input id="email" type="email" placeholder="Email" required>
        <input id="password" type="password" placeholder="Password (min 8 karakter)" minlength="8" required>
        <button id="authSubmit" type="submit">Masuk</button>
      </form>
      <p id="authMsg" class="msg"></p>
    </section>

    <section id="vaultView" class="hidden">
      <div class="welcome">
        <div><span class="muted">Akun</span><h2 id="userEmail">-</h2></div>
        <button id="addBtn">+ Tambah Rahasia</button>
      </div>
      <div class="toolbar">
        <input id="search" placeholder="Cari judul atau username...">
        <select id="categoryFilter">
          <option value="">Semua kategori</option>
          <option>Login</option><option>Catatan</option><option>Kartu</option><option>Lainnya</option>
        </select>
      </div>
      <div id="items" class="grid"></div>
      <p id="empty" class="empty hidden">Belum ada data di brankas.</p>
    </section>
  </main>
</div>

<div id="modal" class="modal hidden">
 <div class="modalBox">
  <div class="modalHead"><h3 id="modalTitle">Tambah Rahasia</h3><button id="closeModal">×</button></div>
  <form id="itemForm">
   <input type="hidden" id="itemId">
   <label>Judul<input id="title" required maxlength="120" placeholder="Contoh: Email utama"></label>
   <label>Kategori<select id="category"><option>Login</option><option>Catatan</option><option>Kartu</option><option>Lainnya</option></select></label>
   <label>Username / Identitas<input id="username" maxlength="160" placeholder="username atau email"></label>
   <label>Password / Nilai rahasia<div class="passrow"><input id="secret" type="password" maxlength="500" placeholder="********"><button type="button" id="toggleSecret">👁</button></div></label>
   <label>Catatan<textarea id="notes" maxlength="5000" placeholder="Tambahkan catatan tambahan..."></textarea></label>
   <div class="actions"><button type="button" class="secondary" id="cancelBtn">Batal</button><button type="submit">Simpan</button></div>
  </form>
  <p id="itemMsg" class="msg"></p>
 </div>
</div>

<script>
  // =======================================================
  // KONFIGURASI SUPABASE (GANTI DENGAN MILIK ANDA)
  // =======================================================
  const SUPABASE_URL = "https://dhvjoubaolutcejrvrsq.supabase.co"; 
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRodmpvdWJhb2x1dGNlanJ2cnNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzY0OTQsImV4cCI6MjEwNTkxMjQ5NH0.ZAMdDQn0SzgERT5ftAuowts373TTzHlg30fidcfUGAs";
  
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let currentUser = null;
  let vaultData = [];

  // =======================================================
  // DOM ELEMENTS
  // =======================================================
  const authView = document.getElementById('authView');
  const vaultView = document.getElementById('vaultView');
  const authForm = document.getElementById('authForm');
  const authMsg = document.getElementById('authMsg');
  const logoutBtn = document.getElementById('logoutBtn');
  const userEmailEl = document.getElementById('userEmail');
  
  const itemsGrid = document.getElementById('items');
  const emptyState = document.getElementById('empty');
  const searchInput = document.getElementById('search');
  const categoryFilter = document.getElementById('categoryFilter');

  const modal = document.getElementById('modal');
  const itemForm = document.getElementById('itemForm');
  const itemMsg = document.getElementById('itemMsg');

  // =======================================================
  // AUTENTIKASI (LOGIN / REGISTER / LOGOUT)
  // =======================================================
  let isLogin = true;

  document.getElementById('loginTab').addEventListener('click', () => {
    isLogin = true;
    document.getElementById('loginTab').classList.add('active');
    document.getElementById('registerTab').classList.remove('active');
    document.getElementById('authSubmit').innerText = 'Masuk';
    authMsg.textContent = '';
  });

  document.getElementById('registerTab').addEventListener('click', () => {
    isLogin = false;
    document.getElementById('registerTab').classList.add('active');
    document.getElementById('loginTab').classList.remove('active');
    document.getElementById('authSubmit').innerText = 'Daftar';
    authMsg.textContent = '';
  });

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    authMsg.textContent = '';
    authSubmit.disabled = true;
    authSubmit.innerText = "Memproses...";

    try {
      if (isLogin) {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        authMsg.style.color = '#00ffcc';
        authMsg.textContent = 'Pendaftaran berhasil! Silakan cek email untuk verifikasi (jika diaktifkan) lalu login.';
      }
    } catch (error) {
      authMsg.style.color = '#ff4d4d';
      authMsg.textContent = "Error: " + error.message;
    } finally {
      authSubmit.disabled = false;
      authSubmit.innerText = isLogin ? 'Masuk' : 'Daftar';
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await sb.auth.signOut();
  });

  // Cek status login saat halaman dimuat
  sb.auth.onAuthStateChange(async (event, session) => {
    if (session) {
      currentUser = session.user;
      authView.classList.add('hidden');
      vaultView.classList.remove('hidden');
      logoutBtn.classList.remove('hidden');
      userEmailEl.textContent = currentUser.email;
      await fetchVaultItems();
    } else {
      currentUser = null;
      vaultView.classList.add('hidden');
      authView.classList.remove('hidden');
      logoutBtn.classList.add('hidden');
      authForm.reset();
    }
  });

  // =======================================================
  // CRUD DATABASE (FETCH, ADD, EDIT, DELETE)
  // =======================================================
  async function fetchVaultItems() {
    itemsGrid.innerHTML = '<p class="muted" style="text-align:center; width:100%;">Memuat data...</p>';
    const { data, error } = await sb.from('vault_items').select('*').order('created_at', { ascending: false });
    
    if (error) {
      itemsGrid.innerHTML = `<p class="msg" style="text-align:center; width:100%;">Gagal memuat: ${error.message}</p>`;
      return;
    }

    vaultData = data || [];
    renderItems();
  }

  function renderItems() {
    const searchTerm = searchInput.value.toLowerCase();
    const filterCat = categoryFilter.value;

    let filtered = vaultData.filter(item => {
      const matchSearch = (item.title?.toLowerCase().includes(searchTerm) || item.username?.toLowerCase().includes(searchTerm));
      const matchCat = (filterCat === '' || item.category === filterCat);
      return matchSearch && matchCat;
    });

    itemsGrid.innerHTML = '';
    if (filtered.length === 0) {
      emptyState.classList.remove('hidden');
    } else {
      emptyState.classList.add('hidden');
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="item-actions">
            <button class="edit-btn" data-id="${item.id}">Edit</button>
            <button class="del-btn" data-id="${item.id}">Hapus</button>
          </div>
          <span class="cat">${item.category || 'Lainnya'}</span>
          <h3>${escapeHtml(item.title)}</h3>
          <p>${escapeHtml(item.username || '')}</p>
        `;
        itemsGrid.appendChild(card);
      });

      document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', (e) => openModal(e.target.dataset.id)));
      document.querySelectorAll('.del-btn').forEach(btn => btn.addEventListener('click', (e) => deleteItem(e.target.dataset.id)));
    }
  }

  searchInput.addEventListener('input', renderItems);
  categoryFilter.addEventListener('change', renderItems);

  // MODAL & FORM HANDLING
  document.getElementById('addBtn').addEventListener('click', () => openModal(null));
  document.getElementById('closeModal').addEventListener('click', () => modal.classList.add('hidden'));
  document.getElementById('cancelBtn').addEventListener('click', () => modal.classList.add('hidden'));

  function openModal(id) {
    itemForm.reset();
    itemMsg.textContent = '';
    
    if (id) {
      const item = vaultData.find(i => i.id == id);
      if (!item) return;
      document.getElementById('modalTitle').innerText = 'Edit Rahasia';
      document.getElementById('itemId').value = item.id;
      document.getElementById('title').value = item.title || '';
      document.getElementById('category').value = item.category || 'Login';
      document.getElementById('username').value = item.username || '';
      document.getElementById('secret').value = item.secret || '';
      document.getElementById('notes').value = item.notes || '';
    } else {
      document.getElementById('modalTitle').innerText = 'Tambah Rahasia';
      document.getElementById('itemId').value = '';
    }
    modal.classList.remove('hidden');
  }

  itemForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    itemMsg.textContent = '';
    
    const id = document.getElementById('itemId').value;
    const payload = {
      title: document.getElementById('title').value,
      category: document.getElementById('category').value,
      username: document.getElementById('username').value,
      secret: document.getElementById('secret').value,
      notes: document.getElementById('notes').value,
      user_id: currentUser.id
    };

    try {
      if (id) {
        const { error } = await sb.from('vault_items').update(payload).eq('id', id);
        if (error) throw error;
      } else {
        const { error } = await sb.from('vault_items').insert([payload]);
        if (error) throw error;
      }
      modal.classList.add('hidden');
      await fetchVaultItems();
    } catch (error) {
      itemMsg.textContent = "Gagal menyimpan: " + error.message;
    }
  });

  async function deleteItem(id) {
    if (!confirm("Yakin ingin menghapus data ini secara permanen?")) return;
    const { error } = await sb.from('vault_items').delete().eq('id', id);
    if (error) {
      alert("Gagal menghapus: " + error.message);
    } else {
      await fetchVaultItems();
    }
  }

  // Toggle Password Visibility
  document.getElementById('toggleSecret').addEventListener('click', () => {
    const secretInput = document.getElementById('secret');
    secretInput.type = secretInput.type === 'password' ? 'text' : 'password';
  });

  // Helper mencegah XSS dasar
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>
</body>
</html>
